  ha-card-box-shadow: "inset 0 1px 0 rgba(255, 255, 255, 0.75), inset 0 -1px 0 rgba(255, 255, 255, 0.60), inset 0 -10px 18px -14px rgba(255, 255, 255, 0.90), 0 10px 30px rgba(31, 38, 135, 0.14)"
  card-background-color: "#ffffff"
  primary-text-color: "#1b2230"
  secondary-text-color: "#4a5568"
  disabled-text-color: "#94a0b2"
