# Liquid-glass themes for the Show dashboard. GENERATED by build_glass.js, edit that.
# Backgrounds are images in /config/www/bg (served at /local/bg), see README.
# Picked by the "Show glass follows the sky" automation from sun elevation + weather.

Glass Dawn:
  lovelace-background: "linear-gradient(rgba(255, 255, 255, 0.02), rgba(255, 255, 255, 0.06)), url('/local/bg/strip-dawn.jpg') center bottom / 100% auto no-repeat, #fcc6b2"
