# Day and Night themes for the Show dashboard.
# Swapped by the "Show theme follows the sun" automation (frontend.set_theme).
# Both themes set the base colours explicitly so they look the same on a
# device that prefers light and one that prefers dark.

Day:
  primary-color: "#0288d1"
  accent-color: "#ff9800"
  primary-background-color: "#f4f6f8"
  secondary-background-color: "#e8ecf0"
  card-background-color: "#ffffff"
  clear-background-color: "#f4f6f8"
  primary-text-color: "#1f2933"
  secondary-text-color: "#5f6b7a"
  disabled-text-color: "#a0a8b3"
  text-primary-color: "#ffffff"
  divider-color: "rgba(0, 0, 0, 0.10)"
  outline-color: "rgba(0, 0, 0, 0.12)"
  app-header-background-color: "#ffffff"
  app-header-text-color: "#1f2933"
  app-header-edit-background-color: "#e8ecf0"
  sidebar-background-color: "#ffffff"
  sidebar-text-color: "#5f6b7a"
  sidebar-icon-color: "#5f6b7a"
  sidebar-selected-text-color: "#0288d1"
  sidebar-selected-icon-color: "#0288d1"
  state-icon-color: "#5f6b7a"
  state-icon-active-color: "#f9a825"
  switch-checked-color: "#0288d1"
  switch-unchecked-button-color: "#ffffff"
  switch-unchecked-track-color: "#b0b8c1"
  ha-card-border-radius: "16px"
  ha-card-border-width: "0px"
  ha-card-box-shadow: "0 1px 3px rgba(16, 24, 40, 0.08)"
  input-fill-color: "rgba(0, 0, 0, 0.04)"
  input-ink-color: "#1f2933"
  input-label-ink-color: "#5f6b7a"
  input-idle-line-color: "rgba(0, 0, 0, 0.35)"
  input-hover-line-color: "rgba(0, 0, 0, 0.8)"
  codemirror-keyword: "#6f42c1"
  codemirror-operator: "#1f2933"
  codemirror-variable: "#005cc5"
  codemirror-string: "#032f62"
  codemirror-number: "#005cc5"
  codemirror-comment: "#6a737d"
  codemirror-property: "#005cc5"
  codemirror-atom: "#005cc5"
  codemirror-meta: "#1f2933"
  codemirror-qualifier: "#6f42c1"

Night:
  primary-color: "#4fc3f7"
  accent-color: "#ffb74d"
  primary-background-color: "#0f1216"
  secondary-background-color: "#171b21"
  card-background-color: "#1b2027"
  clear-background-color: "#0f1216"
  primary-text-color: "#e6e9ee"
  secondary-text-color: "#9aa4b1"
  disabled-text-color: "#5c6673"
  text-primary-color: "#0f1216"
  divider-color: "rgba(255, 255, 255, 0.10)"
  outline-color: "rgba(255, 255, 255, 0.12)"
  app-header-background-color: "#0f1216"
  app-header-text-color: "#e6e9ee"
  app-header-edit-background-color: "#171b21"
  sidebar-background-color: "#0f1216"
  sidebar-text-color: "#9aa4b1"
  sidebar-icon-color: "#9aa4b1"
  sidebar-selected-text-color: "#4fc3f7"
  sidebar-selected-icon-color: "#4fc3f7"
  state-icon-color: "#9aa4b1"
  state-icon-active-color: "#ffca28"
  switch-checked-color: "#4fc3f7"
  switch-unchecked-button-color: "#9aa4b1"
  switch-unchecked-track-color: "#3a4350"
  ha-card-border-radius: "16px"
  ha-card-border-width: "0px"
  ha-card-box-shadow: "none"
  input-fill-color: "rgba(255, 255, 255, 0.05)"
  input-ink-color: "#e6e9ee"
  input-label-ink-color: "#9aa4b1"
  input-idle-line-color: "rgba(255, 255, 255, 0.42)"
  input-hover-line-color: "rgba(255, 255, 255, 0.87)"
  input-disabled-line-color: "rgba(255, 255, 255, 0.06)"
  input-outlined-idle-border-color: "rgba(255, 255, 255, 0.38)"
  input-outlined-hover-border-color: "rgba(255, 255, 255, 0.87)"
  input-dropdown-icon-color: "rgba(255, 255, 255, 0.54)"
  mdc-ripple-color: "#aaaaaa"
  map-filter: "invert(.9) hue-rotate(170deg) brightness(1.5) contrast(1.2) saturate(.3)"
  codemirror-keyword: "#c792ea"
  codemirror-operator: "#89ddff"
  codemirror-variable: "#f07178"
  codemirror-variable-2: "#eeffff"
  codemirror-variable-3: "#decb6b"
  codemirror-builtin: "#ffcb6b"
  codemirror-atom: "#f78c6c"
  codemirror-number: "#ff5370"
  codemirror-def: "#82aaff"
  codemirror-string: "#c3e88d"
  codemirror-string-2: "#f07178"
  codemirror-comment: "#545454"
  codemirror-tag: "#ff5370"
  codemirror-meta: "#ffcb6b"
  codemirror-attribute: "#c792ea"
  codemirror-property: "#c792ea"
  codemirror-qualifier: "#decb6b"
  codemirror-type: "#decb6b"
